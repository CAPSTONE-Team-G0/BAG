{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/semestersstyle.css') }}">
{% endblock %}

{% block content %}

<div class="card">
  <h2>Edit Semester</h2>

  <form method="post" class="form grid">

    <div>
      <label>Semester term</label>
      <select name="term" required>
        <option value="" disabled>Select term</option>
        <option value="Spring" {% if semester.term == "Spring" %}selected{% endif %}>Spring</option>
        <option value="Summer" {% if semester.term == "Summer" %}selected{% endif %}>Summer</option>
        <option value="Fall" {% if semester.term == "Fall" %}selected{% endif %}>Fall</option>
      </select>
    </div>

    <div>
      <label>Year</label>
      <select name="year" required>
        <option value="" disabled>Select year</option>
        <option value="2025" {% if semester.year == 2025 or semester.year == "2025" %}selected{% endif %}>2025</option>
        <option value="2026" {% if semester.year == 2026 or semester.year == "2026" %}selected{% endif %}>2026</option>
        <option value="2027" {% if semester.year == 2027 or semester.year == "2027" %}selected{% endif %}>2027</option>
        <option value="2028" {% if semester.year == 2028 or semester.year == "2028" %}selected{% endif %}>2028</option>
        <option value="2029" {% if semester.year == 2029 or semester.year == "2029" %}selected{% endif %}>2029</option>
        <option value="2030" {% if semester.year == 2030 or semester.year == "2030" %}selected{% endif %}>2030</option>
      </select>
    </div>

    <div>
      <label>Start date</label>
      <input type="date" name="start_date" value="{{ semester.start_date }}" required>
    </div>

    <div>
      <label>End date</label>
      <input type="date" name="end_date" value="{{ semester.end_date }}" required>
    </div>

    <div class="full">
      <button class="btn" type="submit">Save Changes</button>
    </div>
  </form>

  <form method="post" action="{{ url_for('semesters.semester_delete', semester_id=semester.id) }}">
    <button class="btn secondary" type="submit">Delete Semester</button>
  </form>
</div>

{% endblock %}
