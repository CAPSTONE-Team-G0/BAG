{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expensestyle.css') }}">
{% endblock %}

{% block content %}

<div class="card">
  <h2>Edit Transaction</h2>

  <form method="post" class="form grid">
    <input type="hidden" name="type" value="{{ transaction.type }}">

    <div>
      <label>Category</label>
      <select name="category_id" required>
        <option value="" disabled {% if not transaction.category_id %}selected{% endif %}>
          Select category
        </option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if transaction.category_id == c.id %}selected{% endif %}>
            {{ c.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="full">
      <label>Note</label>
      <input
        name="note"
        value="{{ transaction.note or '' }}"
        placeholder="Shopping, etc"
      >
    </div>

    <div>
      <label>Amount ($)</label>
      <input
        type="number"
        step="0.01"
        min="0.01"
        name="amount"
        value="{{ '%.2f'|format(transaction.amount_cents / 100) }}"
        required
      >
    </div>

    <div>
      <label>Date</label>
      <input type="date" name="date" value="{{ transaction.date }}" required>
    </div>

    <div class="full">
      <button class="btn" type="submit">Save Changes</button>
    </div>
  </form>

  <form method="post" action="{{ url_for('transactions.transaction_delete', transaction_id=transaction.id) }}">
    <button class="btn secondary" type="submit">Delete Transaction</button>
  </form>
</div>

{% endblock %}
