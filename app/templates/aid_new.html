{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/fundsstyle.css') }}">
{% endblock %}

{% block content %}

<div class="card">
  <h2>Add Funds </h2>
  <form method="post" class="form grid">
    <div>
      <label>Source type</label>
      <select name="source_type">
        <option value="" disabled selected>Select a source type</option>
        <option>Income</option>
        <option>FAFSA</option>
        <option>GI Bill</option>
        <option>Scholarship</option>
        <option>Loan</option>
        <option>Savings</option>
        <option>Other</option>
      </select>
    </div>
    <div class="full">
      <label>Label</label>
      <input name="label" placeholder="FAFSA refund, GI Bill housing, Scholarship name, etc">
    </div>
    <div>
      <label>Amount ($)</label>
      <input type="number" step="0.01" min="0.01" name="amount" required>
    </div>
    <div>
      <label>Date</label>
      <input type="date" name="disbursement_date" required>
    </div>
    <div class="full">
      <button class="btn" type="submit">Save Funds</button>
    </div>
  </form>
</div>
{% endblock %}
