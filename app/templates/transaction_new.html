{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expensestyle.css') }}">
{% endblock %}

{% block content %}

<div class="card">
  <h2>Add Expense</h2>

  <form method="post" class="form grid">
    <input type="hidden" name="type" value="expense">

    <div>
      <label>Category</label>
      <select name="category_id" required>
        <option value="" disabled selected>Select category</option>
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="full">
      <label>Note</label>
      <input name="note" placeholder="Shopping, etc">
    </div>

    <div>
      <label>Amount ($)</label>
      <input
        type="number"
        step="0.01"
        min="0.01"
        name="amount"
        required
      >
    </div>

    <div>
      <label>Date</label>
      <input type="date" name="date" value="{{ today }}" required>
    </div>

    <div class="full">
      <button class="btn" type="submit">Save Expense</button>
    </div>
  </form>

</div>

{% endblock %}
