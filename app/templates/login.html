{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/miscstyle.css') }}">
{% endblock %}

{% block content %}
{% include "partials/auth_nav.html" %}

<div class="login-split-page">
  <section class="login-welcome-panel">
    <img
      src="{{ url_for('static', filename='images/logos/baglogomain.png') }}"
      alt="BAG Semester Budgeting Logo"
      class="login-main-logo"
    >

    <div class="login-welcome-text">
      <h1>Welcome</h1>
      <p>Plan your semester, track your money, and secure your bag.</p>
    </div>
  </section>

  <section class="login-form-panel">
    <div class="card narrow login-card">
      <h2>Login</h2>
    

      <form method="post" class="form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <label class="checkbox-row" style="margin-top: 8px;">
        <input
        type="checkbox"
        onchange="document.getElementById('password').type = this.checked ? 'text' : 'password';"
        >
        <span>Show password</span>
        </label>

        <button class="btn" type="submit">Login</button>
      </form>

      <p class="muted">
        No account?
        <a href="{{ url_for('auth.register') }}">Register</a>
      </p>

      <p class="hint">
        <a class="link" href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
      </p>

      
    </div>
  </section>
</div>

{% endblock %}
